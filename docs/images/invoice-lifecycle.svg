<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Velure invoice lifecycle</title>
  <desc id="desc">Prepare an invoice, validate it, and simulate submission in a mock sandbox. Only the mock accepted path continues to customer delivery and payment tracking. Rejected mock invoices need corrections. Neither result is NRS or MBS clearance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#181512"/><stop offset="1" stop-color="#0e1012"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#817970"/>
    </marker>
    <style>
      .eyebrow{font:600 12px ui-sans-serif,system-ui;letter-spacing:2px;fill:#e95b4e}
      .heading{font:600 22px ui-sans-serif,system-ui;fill:#f4eee8}
      .body{font:14px ui-sans-serif,system-ui;fill:#b3aaa0}
      .small{font:12px ui-sans-serif,system-ui;fill:#a49a91}
      .card{fill:#211e1b;stroke:#39322c;stroke-width:1.5}
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="388" rx="22" fill="url(#bg)" stroke="#312b26"/>
  <text x="42" y="46" class="eyebrow">A CLEAR PATH FROM DRAFT TO PAYMENT</text>
  <text x="42" y="78" class="body">The clearance step is simulated. No invoice is sent to the NRS or MBS.</text>

  <g transform="translate(42 118)">
    <rect width="190" height="112" rx="14" class="card"/>
    <circle cx="28" cy="28" r="13" fill="#3a2d24"/><text x="24" y="33" class="small" fill="#f0b95c">1</text>
    <text x="20" y="64" class="heading">Prepare</text>
    <text x="20" y="88" class="body">Buyer, items, taxes</text>
    <text x="20" y="106" class="small">Draft → Ready</text>
  </g>
  <path d="M240 174h36" stroke="#817970" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(286 118)">
    <rect width="190" height="112" rx="14" class="card"/>
    <circle cx="28" cy="28" r="13" fill="#26372f"/><text x="24" y="33" class="small" fill="#8bd0a9">2</text>
    <text x="20" y="64" class="heading">Validate</text>
    <text x="20" y="88" class="body">Fields, TIN, totals</text>
    <text x="20" y="106" class="small">Fix issues before submit</text>
  </g>
  <path d="M484 174h36" stroke="#817970" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(530 118)">
    <rect width="210" height="112" rx="14" fill="#281e1a" stroke="#9b493e" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="13" fill="#4b2924"/><text x="24" y="33" class="small" fill="#ff9587">3</text>
    <text x="20" y="64" class="heading">Mock sandbox</text>
    <text x="20" y="88" class="body">Success, reject, retry</text>
    <text x="20" y="106" class="small">No real provider request</text>
  </g>
  <path d="M748 174h38" stroke="#817970" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(772 118)">
    <rect width="190" height="112" rx="14" fill="#1d2822" stroke="#45604d" stroke-width="1.5"/>
    <text x="18" y="39" class="eyebrow">MOCK ACCEPTED</text>
    <text x="18" y="69" class="heading">Sample result</text>
    <text x="18" y="94" class="small">Not NRS clearance</text>
  </g>
  <path d="M970 174h26" stroke="#817970" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(1004 118)">
    <rect width="154" height="112" rx="14" class="card"/>
    <text x="16" y="45" class="heading">Deliver</text>
    <text x="16" y="71" class="body">PDF / email</text>
    <text x="16" y="94" class="small">Track payment</text>
  </g>

  <path d="M635 230v41h129" fill="none" stroke="#817970" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="772" y="246" width="386" height="50" rx="11" fill="#241a18" stroke="#71392f"/>
  <text x="790" y="268" class="eyebrow">MOCK REJECTED</text>
  <text x="790" y="287" class="small">Show a correction, then retry. Do not deliver.</text>

  <rect x="42" y="320" width="1116" height="42" rx="10" fill="#241a18" stroke="#71392f"/>
  <text x="60" y="347" class="body">Mock IRN and QR payloads are examples only. Real NRS clearance requires a confirmed provider integration.</text>
</svg>
