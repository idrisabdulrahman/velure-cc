# Velure reverse proxy — /etc/nginx/sites-available/velure.variadic.ng
#
#   sudo cp deploy/nginx-velure.conf /etc/nginx/sites-available/velure.variadic.ng
#   sudo ln -s /etc/nginx/sites-available/velure.variadic.ng /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS is terminated here. The Node server binds 127.0.0.1:8490 and must only ever
# be reached through this block.
#
# Before enabling: point the DNS A/AAAA record for velure.variadic.ng at the VPS,
# then obtain the certificate with:
#   sudo certbot --nginx -d velure.variadic.ng

# Maps a WebSocket upgrade request to a hop-by-hop Connection header. Declared in
# the `http` context, which is where `sites-enabled/*` files are included.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name velure.variadic.ng;

    # certbot's HTTP-01 challenge must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name velure.variadic.ng;

    server_tokens off;

    # --- TLS (certbot manages these paths) ---
    ssl_certificate     /etc/letsencrypt/live/velure.variadic.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/velure.variadic.ng/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:VelureTLS:10m;
    # Stateless session resumption; omit tickets so a stolen ticket key cannot
    # decrypt past sessions.
    ssl_session_tickets off;

    # --- Response headers ---
    # Start with a short max-age; raise it to 63072000 only once you are certain
    # every subdomain will always be HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Request limits ---
    client_max_body_size 25m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    location / {
        proxy_pass http://127.0.0.1:8490;
        proxy_http_version 1.1;

        # --- Client-IP trust boundary (security critical) ---
        # better-auth derives its rate-limit key from the FIRST entry of
        # X-Forwarded-For. This directive REPLACES the header with the real peer
        # address. Never switch to $proxy_add_x_forwarded_for: that would append
        # to a client-supplied value and let a caller rotate the header to bypass
        # the sign-in rate limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        # --- Origin reconstruction (security critical) ---
        # srvx (the Nitro Node server) builds the request URL from `Host` and
        # `X-Forwarded-Proto`. Without these the app would see
        # http://127.0.0.1:8490/api/auth/... and could emit cookies without the
        # Secure attribute on a public HTTPS origin.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Streaming SSR and PDF generation can take a while; do not let nginx
        # buffer the whole response or time the request out mid-stream.
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
